name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Postgres thật cho e2e test (ràng buộc chống đặt trùng, hàng đợi pg-boss... đều cần database thật)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gnoud_book_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gnoud_book_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/gnoud_book_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # lấy phiên bản từ trường "packageManager" trong package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: E2E tests (API, trên Postgres thật)
        run: pnpm --filter @gnoud-book/api test:e2e

      - name: Build
        run: pnpm build
